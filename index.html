<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawCare — Smart Pet Health & Care</title>
  <meta name="description" content="PawCare is a modern pet-care platform for pets, veterinary appointments, reminders, shopping and AI-assisted care." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast-root"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">🐾</div>
        <div><strong>PawCare</strong><span>Pet health, simplified</span></div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Overview</button>
        <button class="nav-item" data-view="pets"><span>🐕</span> My Pets</button>
        <button class="nav-item" data-view="appointments"><span>◷</span> Appointments</button>
        <button class="nav-item" data-view="reminders"><span>◉</span> Reminders</button>
        <button class="nav-item" data-view="shop"><span>🛍</span> Pet Store</button>
        <button class="nav-item" data-view="ai"><span>✦</span> AI Care Assistant</button>
        <button class="nav-item" data-view="emergency"><span>✚</span> Emergency Help</button>
        <div class="nav-label">Workspace</div>
        <button class="nav-item" data-view="history"><span>↺</span> Care History</button>
        <button class="nav-item" data-view="profile"><span>⚙</span> Profile</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="pro-card">
          <div class="sparkle">✦</div>
          <strong>Smart Care</strong>
          <p>Keep every pet's health routine in one place.</p>
          <button data-view="ai">Ask PawCare AI →</button>
        </div>
        <div class="mini-user">
          <div class="avatar" id="side-avatar">N</div>
          <div><strong id="side-name">Guest Owner</strong><span>Pet parent</span></div>
          <button id="logout-btn" title="Log out">↪</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu">☰</button>
        <div class="breadcrumb" id="breadcrumb">Overview</div>
        <div class="top-actions">
          <button class="icon-btn" data-view="reminders" title="Reminders">🔔<i id="notification-dot"></i></button>
          <div class="top-profile" id="top-profile">
            <div class="avatar small" id="top-avatar">N</div>
            <div><strong id="top-name">Guest Owner</strong><span>Pet parent</span></div>
          </div>
        </div>
      </header>

      <section id="view-dashboard" class="view active-view"></section>
      <section id="view-pets" class="view"></section>
      <section id="view-appointments" class="view"></section>
      <section id="view-reminders" class="view"></section>
      <section id="view-shop" class="view"></section>
      <section id="view-ai" class="view"></section>
      <section id="view-emergency" class="view"></section>
      <section id="view-history" class="view"></section>
      <section id="view-profile" class="view"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
